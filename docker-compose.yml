# The name of the Docker Compose environment.
name: devtiro-build-task-app
services:
  # The UI service.
  ui:
    # Build the UI image from the source in the frontend directory.
    build: ./frontend
    network_mode: host
    # Tell the UI how to find your Spring Boot app.
    environment:
      - BACKEND_HOST=localhost
      - BACKEND_PORT=8080


